<script>
  (() => {
    const section = document.querySelector('.map-section');
    const buttons = [...section.querySelectorAll('[data-place]')];
    const connectors = [...section.querySelectorAll('[data-connector]')];
    const announcement = document.getElementById('place-story');
    const mobile = window.matchMedia('(max-width: 48rem)');

    const places = {
      'san-diego': 'I was born in San Diego',
      rochester: 'I went to Rochester',
      'hong-kong': 'I grew up in Hong Kong',
      bangkok: 'My family is from Bangkok'
    };

    function selectPlace(id) {
      announcement.textContent = places[id];

      buttons.forEach(button => {
        button.setAttribute(
          'aria-pressed',
          String(button.dataset.place === id)
        );
      });

      connectors.forEach(connector => {
        connector.classList.toggle(
          'is-active',
          connector.dataset.connector === id
        );
      });
    }

    function updateControls() {
      buttons.forEach(button => {
        const decorativeDot =
          mobile.matches && button.classList.contains('map-pin');

        button.disabled = decorativeDot;

        if (decorativeDot) {
          button.setAttribute('aria-hidden', 'true');
        } else {
          button.removeAttribute('aria-hidden');
        }
      });

      document.getElementById('map-help').textContent = mobile.matches
        ? 'Choose a note below to explore the map.'
        : 'Select a dot or a note to explore.';
    }

    buttons.forEach(button => {
      button.addEventListener('click', () => {
        selectPlace(button.dataset.place);
      });
    });

    mobile.addEventListener('change', updateControls);

    updateControls();
    document.getElementById('map-help').hidden = false;
  })();
</script>
