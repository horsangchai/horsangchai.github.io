<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#60283d">
  <meta name="description" content="Explore projects by Malachi Horsangchai.">
  <meta name="author" content="Malachi Horsangchai">

  <link rel="canonical" href="https://horsangchai.com/projects.html">

  <title>Projects | Malachi Horsangchai</title>

  <style>
    :root {
      color-scheme: light;
      --paper: #faf8f5;
      --surface: #f0eae5;
      --ink: #282329;
      --muted: #665e63;
      --accent: #60283d;
      --line: #dcd3ce;
      --serif: Georgia, "Times New Roman", serif;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 1rem;
      line-height: 1.65;
    }

    main {
      flex: 1;
    }

    h1, h2, p {
      margin: 0;
    }

    a {
      color: inherit;
      text-underline-offset: 0.3em;
    }

    a:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 4px;
    }

    ::selection {
      background: var(--accent);
      color: #fff;
    }

    .container {
      width: min(100% - 4rem, 72rem);
      margin-inline: auto;
    }

    .skip-link {
      position: fixed;
      top: 1rem;
      left: 1rem;
      z-index: 10;
      padding: 0.75rem 1rem;
      background: var(--accent);
      color: #fff;
      transform: translateY(-200%);
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    /* Shared header */

    .site-header {
      border-bottom: 1px solid var(--line);
    }

    .header-inner {
      min-height: 6.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.85rem;
      text-decoration: none;
    }

    .monogram {
      display: grid;
      place-items: center;
      width: 2.75rem;
      height: 2.75rem;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font-family: var(--serif);
      font-size: 1.1rem;
      letter-spacing: -0.06em;
    }

    .brand-name {
      font-size: 0.9375rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    .nav-list {
      display: flex;
      gap: 1.75rem;
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .nav-list a {
      display: inline-flex;
      align-items: center;
      min-height: 2.75rem;
      color: var(--muted);
      font-size: 0.9375rem;
      text-decoration: none;
    }

    .nav-list a[aria-current="page"] {
      color: var(--accent);
      text-decoration: underline;
      text-decoration-thickness: 2px;
    }

    .nav-list a:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    /* Project overview */

    .projects-main {
      padding-block: 4.75rem;
    }

    h1 {
      font-family: var(--serif);
      font-size: clamp(3.5rem, 6.2vw, 5.5rem);
      font-weight: 400;
      line-height: 1.04;
      letter-spacing: -0.055em;
    }

    .intro-copy {
      margin-top: 1.5rem;
      color: var(--muted);
      font-size: 1.125rem;
    }

    .project-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1.25rem;
      list-style: none;
      padding: 0;
      margin: 3rem 0 0;
    }

    .project-list li {
      min-width: 0;
    }

    .project-link {
      display: flex;
      align-items: center;
      min-height: 11rem;
      height: 100%;
      padding: 2rem;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--accent);
      text-decoration: none;
      transition:
        background-color 180ms ease,
        border-color 180ms ease;
    }

    .project-link:hover {
      border-color: var(--accent);
      background: var(--surface);
    }

    .project-link:hover h2 {
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 0.2em;
    }

    .project-link h2 {
      font-family: var(--serif);
      font-size: clamp(2rem, 3vw, 2.75rem);
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: -0.035em;
    }

    /* Shared footer */

    .site-footer {
      border-top: 1px solid var(--line);
    }

    .footer-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding-block: 1.6rem;
      color: var(--muted);
      font-size: 0.875rem;
    }

    .footer-inner a {
      display: inline-flex;
      align-items: center;
      min-height: 2.75rem;
      text-decoration: none;
    }

    .footer-inner a:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    /* Responsive layout */

    @media (max-width: 48rem) {
      .container {
        width: min(100% - 2.5rem, 38rem);
      }

      .header-inner {
        min-height: 5.5rem;
      }

      .brand-name {
        display: none;
      }

      .nav-list {
        gap: 1.25rem;
      }

      .projects-main {
        padding-block: 3rem;
      }

      h1 {
        font-size: clamp(3.25rem, 10.5vw, 4.75rem);
      }

      .intro-copy {
        font-size: 1.0625rem;
      }

      .project-list {
        grid-template-columns: 1fr;
        gap: 1rem;
        margin-top: 2rem;
      }

      .project-link {
        min-height: 7.5rem;
        padding: 1.5rem;
      }

      .project-link h2 {
        font-size: 2.25rem;
      }
    }

    @media (max-width: 32rem) {
      .footer-inner {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.2rem;
      }
    }

    @media (max-width: 23rem) {
      .container {
        width: calc(100% - 2rem);
      }

      .nav-list {
        gap: 1rem;
      }

      h1 {
        font-size: 3rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container header-inner">
      <a
        class="brand"
        href="index.html"
        aria-label="Malachi Horsangchai — home"
      >
        <span class="monogram" aria-hidden="true">MH</span>
        <span class="brand-name">Malachi Horsangchai</span>
      </a>

      <nav aria-label="Main navigation">
        <ul class="nav-list">
          <li><a href="index.html">Home</a></li>
          <li><a href="projects.html" aria-current="page">Projects</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main" class="container projects-main" tabindex="-1">
    <h1>Projects</h1>

    <p class="intro-copy">
      Click a project to learn more.
    </p>

    <ul class="project-list" aria-label="Projects">
      <li>
        <a class="project-link" href="projects1.html">
          <h2>Project 1</h2>
        </a>
      </li>

      <li>
        <a class="project-link" href="projects2.html">
          <h2>Project 2</h2>
        </a>
      </li>

      <li>
        <a class="project-link" href="projects3.html">
          <h2>Project 3</h2>
        </a>
      </li>
    </ul>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; Malachi Horsangchai</p>
      <a href="index.html">horsangchai.com</a>
    </div>
  </footer>
</body>
</html>
