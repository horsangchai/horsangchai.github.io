<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#60283d">

  <title>Project 2 | Malachi Horsangchai</title>

  <style>
    :root {
      color-scheme: light;
      --paper: #faf8f5;
      --ink: #282329;
      --muted: #665e63;
      --accent: #60283d;
      --line: #dcd3ce;
      --serif: Georgia, "Times New Roman", serif;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 1rem;
      line-height: 1.65;
    }

    main {
      flex: 1;
    }

    h1, p {
      margin: 0;
    }

    a {
      color: inherit;
      text-underline-offset: 0.3em;
    }

    a:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 4px;
      border-radius: 3px;
    }

    ::selection {
      background: var(--accent);
      color: #fff;
    }

    .container {
      width: min(100% - 4rem, 72rem);
      margin-inline: auto;
    }

    .skip-link {
      position: fixed;
      top: 1rem;
      left: 1rem;
      z-index: 10;
      padding: 0.75rem 1rem;
      background: var(--accent);
      color: #fff;
      transform: translateY(-200%);
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    .site-header {
      border-bottom: 1px solid var(--line);
    }

    .header-inner {
      min-height: 6.25rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem 1.5rem;
      padding-block: 1rem;
    }

    .page-title {
      color: var(--accent);
      font-family: var(--serif);
      font-size: clamp(1.75rem, 3vw, 2.25rem);
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: -0.035em;
    }

    .nav-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem 1.75rem;
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .nav-list a {
      display: inline-flex;
      align-items: center;
      min-height: 2.75rem;
      color: var(--muted);
      font-size: 0.9375rem;
      text-decoration: none;
    }

    .nav-list a[aria-current="location"] {
      color: var(--accent);
      text-decoration: underline;
      text-decoration-thickness: 2px;
    }

    .nav-list a:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    .site-footer {
      border-top: 1px solid var(--line);
    }

    .footer-inner {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.25rem 1rem;
      padding-block: 1.6rem;
      color: var(--muted);
      font-size: 0.875rem;
    }

    .footer-inner a {
      display: inline-flex;
      align-items: center;
      min-height: 2.75rem;
      text-decoration: none;
    }

    .footer-inner a:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    @media (max-width: 48rem) {
      .container {
        width: min(100% - 2.5rem, 38rem);
      }

      .nav-list {
        column-gap: 1.25rem;
      }
    }

    @media (max-width: 23rem) {
      .container {
        width: calc(100% - 2rem);
      }

      .header-inner {
        align-items: flex-start;
        flex-direction: column;
      }

      .nav-list {
        column-gap: 1rem;
      }

      .footer-inner {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container header-inner">
      <h1 class="page-title">Project 2</h1>

      <nav aria-label="Main navigation">
        <ul class="nav-list">
          <li><a href="index.html">Home</a></li>
          <li><a href="projects.html" aria-current="location">Projects</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main
    id="main"
    class="container"
    tabindex="-1"
    aria-label="Project 2 content"
  >
    <!-- Add future Project 2 content here. -->
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; Malachi Horsangchai</p>
      <a href="index.html">horsangchai.com</a>
    </div>
  </footer>
</body>
</html>
